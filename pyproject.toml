[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pybac"
dynamic = ["version"]
description = "Policy-based access control: verdicts, field masking and query filters from one policy set"
readme = "README.md"
requires-python = ">=3.11"
license = "ISC"
license-files = ["LICENSE"]
authors = [{ name = "boudah" }]
keywords = [
  "authorization",
  "access-control",
  "pbac",
  "abac",
  "policy",
  "permissions",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/boudah/pybac"
Documentation = "https://github.com/boudah/pybac/tree/main/docs"
Source = "https://github.com/boudah/pybac"
Issues = "https://github.com/boudah/pybac/issues"
Changelog = "https://github.com/boudah/pybac/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

# One version, read from the package itself.
[tool.hatch.version]
path = "src/pybac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pybac"]

# Without this the sdist picks up whatever happens to be in the working tree.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
# The documentation is executable: its examples are checked on every run.
addopts = "-q --doctest-glob=*.md"
doctest_optionflags = "ELLIPSIS IGNORE_EXCEPTION_DETAIL"

[tool.coverage.run]
source = ["src/pybac"]
branch = true

[tool.coverage.report]
# Every line of a policy engine decides who gets in. Anything unreachable is
# either dead or a guard, and a guard says so with a pragma.
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
